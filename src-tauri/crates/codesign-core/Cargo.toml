[package]
name = "codesign-core"
version = "0.1.0"
edition = "2021"
description = "Host-agnostic space document model and operation layer for codesign"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "0.8"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
